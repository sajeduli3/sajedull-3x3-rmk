name: Build RMK Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install ARM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Install flip-link
        run: cargo install flip-link

      - name: Build RMK
        working-directory: rmk
        run: cargo build --release

      - name: Create binary
        run: |
          arm-none-eabi-objcopy \
            -O binary \
            rmk/target/thumbv7em-none-eabihf/release/sajedull-3x3-rmk \
            firmware.bin

      - name: Download UF2 converter
        run: |
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
          test -s uf2conv.py
          head -n 2 uf2conv.py

      - name: Create UF2
        run: |
          python3 uf2conv.py \
            firmware.bin \
            -c \
            -f 0xADA52840 \
            -b 0x26000 \
            -o sajedull-3x3-rmk.uf2

      - name: Check firmware
        run: |
          ls -lh firmware.bin
          ls -lh sajedull-3x3-rmk.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sajedull-3x3-rmk-firmware
          path: |
            firmware.bin
            sajedull-3x3-rmk.uf2
          if-no-files-found: error
