name: Build RMK Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf

      - name: Install ARM GNU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Install flip-link
        run: cargo install flip-link

      - name: Build firmware
        working-directory: rmk
        run: cargo build --release

            - name: Install UF2 converter
        run: |
          git clone --depth 1 https://github.com/microsoft/uf2-samdx1.git uf2conv
          find uf2conv -name uf2conv.py -type f

      - name: Create UF2 firmware
        working-directory: rmk
        run: |
          mkdir -p ../artifacts

          arm-none-eabi-objcopy \
            -O binary \
            target/thumbv7em-none-eabihf/release/sajedull-3x3-rmk \
            firmware.bin

          python3 ../uf2conv/uf2conv.py \
            firmware.bin \
            -c \
            -f 0xADA52840 \
            -b 0x26000 \
            -o ../artifacts/sajedull-3x3-rmk.uf2

      - name: Upload UF2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: sajedull-3x3-rmk-firmware
          path: artifacts/sajedull-3x3-rmk.uf2
          if-no-files-found: error
